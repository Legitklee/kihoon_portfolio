<link id="fa-stylesheet" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@latest/css/all.min.css">

<footer class="site-footer h-card">
  <data class="u-url" value="{{ '/' | relative_url }}"></data>

  <div class="wrapper">
    <div class="footer-col-wrapper">

      <!-- Left column: Links -->
      <div class="footer-col">
        <ul class="contact-list">
          <li><a href="mailto:{{ site.author.email }}">{{ site.author.email }}</a></li>
          <li><a href="https://github.com/{{ site.github_username }}" target="_blank"><i class="fab fa-github"></i> GitHub</a></li>
          <li><a href="https://linkedin.com/in/{{ site.linkedin_username }}" target="_blank"><i class="fab fa-linkedin"></i> LinkedIn</a></li>
        </ul>
      </div>

      <!-- Middle column: Resume -->
      <div class="footer-col">
        <a class="resume-button" href="{{ '/assets/resume.pdf' | relative_url }}" download>
          <button>Download Resume</button>
        </a>
      </div>

      <!-- Right column: Description -->
      <div class="footer-col">
        <p>{{ site.description | escape }}</p>
      </div>

    </div>
  </div>
</footer>
