<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ page.title | escape }} | {{ site.title | escape }}</title>

    {%- seo -%}
    <link rel="stylesheet" href="{{ "/assets/main.css" | relative_url }}">
    {%- feed_meta -%}
    {%- if site.google_analytics -%}
      {%- include google-analytics.html -%}
    {%- endif -%}
  </head>

  <body>
    
    <header class="site-header">
        <div class="wrapper">
          <div class="nav-container">
            <a class="site-title" href="{{ "/" | relative_url }}">{{ site.title | escape }}</a>
      
            <!-- Hamburger toggle (mobile only) -->
            <button class="nav-toggle" id="nav-toggle" aria-label="Toggle navigation">
              ☰
            </button>
          </div>
      
          <nav class="site-nav" id="site-nav">
            <a class="page-link" href="{{ "/projects/" | relative_url }}">Projects</a>
            <a class="page-link" href="{{ "/skills/" | relative_url }}">Skills</a>
            <a class="page-link" href="{{ "/experience/" | relative_url }}">Experience</a>
            <a class="page-link" href="{{ "/education/" | relative_url }}">Education</a>
            <a class="page-link" href="{{ "/about/" | relative_url }}">About</a>
          </nav>
        </div>
      </header>
      

    <main class="page-content" aria-label="Content">
        {% if page.full_width %}
          {{ content }}
        {% else %}
          <div class="wrapper">
            {{ content }}
          </div>
        {% endif %}
      </main>      

    <!-- ✅ Pull in Minima footer using your original footer.html -->
    {%- include footer.html -%}

    <script>
        document.addEventListener("DOMContentLoaded", function () {
          const toggle = document.getElementById("nav-toggle");
          const nav = document.getElementById("site-nav");
      
          toggle.addEventListener("click", () => {
            nav.classList.toggle("open");
          });
        });
      </script>
      

  </body>
</html>
