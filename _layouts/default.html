<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ page.title | escape }} | {{ site.title | escape }}</title>

    {%- seo -%}
    <link rel="stylesheet" href="{{ "/assets/main.css" | relative_url }}">
    {%- feed_meta -%}
    {%- if site.google_analytics -%}
      {%- include google-analytics.html -%}
    {%- endif -%}
  </head>

  <body>
    <!-- 💡 Minima header with wrapper -->
    <header class="site-header">
      <div class="wrapper">
        <a class="site-title" href="{{ "/" | relative_url }}">{{ site.title | escape }}</a>
        <nav class="site-nav">
          <a class="page-link" href="{{ "/about/" | relative_url }}">About</a>
          <a class="page-link" href="{{ "/projects/" | relative_url }}">Projects</a>
          <a class="page-link" href="{{ "/skills/" | relative_url }}">Skills</a>
          <a class="page-link" href="{{ "/experience/" | relative_url }}">Experience</a>
          <a class="page-link" href="{{ "/education/" | relative_url }}">Education</a>
        </nav>
      </div>
    </header>

    <!-- 💡 No wrapper here so homepage can manage it (banner freedom) -->
    <main class="page-content">
      {{ content }}
    </main>

    <!-- ✅ Pull in Minima footer using your original footer.html -->
    {%- include footer.html -%}
  </body>
</html>
